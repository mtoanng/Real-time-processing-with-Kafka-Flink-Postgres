name: taobao-runtime

x-flink-environment: &flink-environment
  KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:29092}
  KAFKA_TOPIC: user-behavior-events
  KAFKA_RAW_OUTPUT_TOPIC: taobao-raw-events
  KAFKA_METRICS_OUTPUT_TOPIC: taobao-item-metrics-1m
  KAFKA_QUALITY_OUTPUT_TOPIC: taobao-quality-events
  KAFKA_CONSUMER_GROUP: taobao-sql-pipeline
  KAFKA_SECURITY_PROTOCOL: ${KAFKA_SECURITY_PROTOCOL:-PLAINTEXT}
  KAFKA_SASL_MECHANISM: ${KAFKA_SASL_MECHANISM:-}
  KAFKA_SASL_USERNAME: ${KAFKA_SASL_USERNAME:-}
  KAFKA_SASL_PASSWORD: ${KAFKA_SASL_PASSWORD:-}
  SCHEMA_REGISTRY_URL: ${SCHEMA_REGISTRY_URL:-http://schema-registry:8080/apis/ccompat/v7}
  SCHEMA_REGISTRY_BASIC_AUTH_USER_INFO: ${SCHEMA_REGISTRY_BASIC_AUTH_USER_INFO:-}
  FLINK_CHECKPOINT_INTERVAL_MS: ${FLINK_CHECKPOINT_INTERVAL_MS:-60000}
  FLINK_DEDUP_RETENTION_HOURS: ${FLINK_DEDUP_RETENTION_HOURS:-168}
  FLINK_MAX_OUT_OF_ORDERNESS_MS: ${FLINK_MAX_OUT_OF_ORDERNESS_MS:-5000}

services:
  kafka:
    profiles: ["core"]
    image: apache/kafka:3.9.0
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  schema-registry:
    profiles: ["core"]
    image: apicurio/apicurio-registry:3.2.5
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      APICURIO_STORAGE_KIND: mem

  postgres:
    profiles: ["legacy"]
    image: postgres:16.4-alpine
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=4
      - -c
      - max_wal_senders=4
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-catalog}
      POSTGRES_USER: ${POSTGRES_USER:-catalog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-catalog}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/001-catalog.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka-connect:
    profiles: ["legacy"]
    image: quay.io/debezium/connect:3.0.8.Final
    ports:
      - "127.0.0.1:8083:8083"
    depends_on:
      - postgres
    environment:
      BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:29092}
      GROUP_ID: product-catalog-connect
      CONFIG_STORAGE_TOPIC: product-catalog-connect-config
      OFFSET_STORAGE_TOPIC: product-catalog-connect-offsets
      STATUS_STORAGE_TOPIC: product-catalog-connect-status
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: ${KAFKA_CONNECT_REPLICATION_FACTOR:-1}
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: ${KAFKA_CONNECT_REPLICATION_FACTOR:-1}
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: ${KAFKA_CONNECT_REPLICATION_FACTOR:-1}
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_SECURITY_PROTOCOL: ${KAFKA_SECURITY_PROTOCOL:-PLAINTEXT}
      CONNECT_SASL_MECHANISM: ${KAFKA_SASL_MECHANISM:-PLAIN}
      CONNECT_SASL_JAAS_CONFIG: >-
        org.apache.kafka.common.security.plain.PlainLoginModule required
        username="${KAFKA_SASL_USERNAME:-}" password="${KAFKA_SASL_PASSWORD:-}";
      CONNECT_PRODUCER_SECURITY_PROTOCOL: ${KAFKA_SECURITY_PROTOCOL:-PLAINTEXT}
      CONNECT_PRODUCER_SASL_MECHANISM: ${KAFKA_SASL_MECHANISM:-PLAIN}
      CONNECT_PRODUCER_SASL_JAAS_CONFIG: >-
        org.apache.kafka.common.security.plain.PlainLoginModule required
        username="${KAFKA_SASL_USERNAME:-}" password="${KAFKA_SASL_PASSWORD:-}";
      CONNECT_CONSUMER_SECURITY_PROTOCOL: ${KAFKA_SECURITY_PROTOCOL:-PLAINTEXT}
      CONNECT_CONSUMER_SASL_MECHANISM: ${KAFKA_SASL_MECHANISM:-PLAIN}
      CONNECT_CONSUMER_SASL_JAAS_CONFIG: >-
        org.apache.kafka.common.security.plain.PlainLoginModule required
        username="${KAFKA_SASL_USERNAME:-}" password="${KAFKA_SASL_PASSWORD:-}";
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8083/connectors >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20

  clickhouse:
    profiles: ["core"]
    image: clickhouse/clickhouse-server:24.8
    ports:
      - "127.0.0.1:8123:8123"
      - "127.0.0.1:9000:9000"
    environment:
      CLICKHOUSE_DB: taobao_behavior
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-local-clickhouse}
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./clickhouse/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user $$CLICKHOUSE_USER --password $$CLICKHOUSE_PASSWORD --query 'SELECT 1'"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    profiles: ["legacy"]
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    profiles: ["legacy"]
    build:
      context: ..
      dockerfile: infra/api.Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      - clickhouse
      - redis
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:29092}
      KAFKA_TOPIC: user-behavior-events
      KAFKA_SECURITY_PROTOCOL: ${KAFKA_SECURITY_PROTOCOL:-PLAINTEXT}
      KAFKA_SASL_MECHANISM: ${KAFKA_SASL_MECHANISM:-}
      KAFKA_SASL_USERNAME: ${KAFKA_SASL_USERNAME:-}
      KAFKA_SASL_PASSWORD: ${KAFKA_SASL_PASSWORD:-}
      SCHEMA_REGISTRY_URL: ${SCHEMA_REGISTRY_URL:-http://schema-registry:8080/apis/ccompat/v7}
      SCHEMA_REGISTRY_BASIC_AUTH_USER_INFO: ${SCHEMA_REGISTRY_BASIC_AUTH_USER_INFO:-}
      CLICKHOUSE_ENDPOINT: http://clickhouse:8123
      CLICKHOUSE_DATABASE: taobao_behavior
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-local-clickhouse}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_TLS: "false"
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20

  flink-jobmanager:
    profiles: ["core"]
    image: flink:1.20.2-scala_2.12-java11
    command: jobmanager
    ports:
      - "127.0.0.1:8082:8081"
    environment:
      <<: *flink-environment
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        state.checkpoints.dir: file:///var/lib/flink/checkpoints
        restart-strategy.type: fixed-delay
        restart-strategy.fixed-delay.attempts: ${FLINK_RESTART_ATTEMPTS:-3}
        restart-strategy.fixed-delay.delay: ${FLINK_RESTART_DELAY_MS:-10000} ms
    volumes:
      - flink_checkpoints:/var/lib/flink/checkpoints
      - ../flink-sql-pipeline/target/taobao-sql-connectors.jar:/opt/flink/connectors/taobao-sql-connectors.jar:ro
      - ../build/flink/pipeline.sql:/opt/flink/sql/pipeline.sql:ro

  flink-taskmanager:
    profiles: ["core"]
    image: flink:1.20.2-scala_2.12-java11
    command: taskmanager
    depends_on:
      - flink-jobmanager
    environment:
      <<: *flink-environment
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 2
        state.checkpoints.dir: file:///var/lib/flink/checkpoints
    volumes:
      - flink_checkpoints:/var/lib/flink/checkpoints

volumes:
  clickhouse_data:
  flink_checkpoints:
  postgres_data:
  redis_data:
