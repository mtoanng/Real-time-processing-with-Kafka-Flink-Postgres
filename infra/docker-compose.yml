name: ${COMPOSE_PROJECT_NAME:-taobao-runtime}

# The service-free `checks` profile is implemented by Make/CI and starts no
# containers. Every runtime profile reuses one Flink job. Optional services are
# isolated behind serving and observability profiles. The cdc profile renders
# only the deprecated legacy behavior-rule extension.
x-flink-environment: &flink-environment
  RUNTIME_PROFILE: ${RUNTIME_PROFILE:-core}
  KAFKA_BOOTSTRAP_SERVERS: kafka:29092
  KAFKA_TOPIC: ${KAFKA_TOPIC:-user-behavior-events}
  KAFKA_CONSUMER_GROUP: ${KAFKA_CONSUMER_GROUP:-taobao-stream-job}
  KAFKA_SECURITY_PROTOCOL: PLAINTEXT
  SCHEMA_REGISTRY_URL: http://schema-registry:8080/apis/ccompat/v7
  CLICKHOUSE_ENDPOINT: http://clickhouse:8123
  CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
  CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-local-clickhouse}
  CLICKHOUSE_DATABASE: ${CLICKHOUSE_DATABASE:-taobao_behavior}
  FLINK_CHECKPOINTING_ENABLED: ${FLINK_CHECKPOINTING_ENABLED:-true}
  FLINK_CHECKPOINT_INTERVAL_MS: ${FLINK_CHECKPOINT_INTERVAL_MS:-60000}
  FLINK_CHECKPOINT_DIR: file:///var/lib/flink/checkpoints
  FLINK_RESTART_ATTEMPTS: ${FLINK_RESTART_ATTEMPTS:-3}
  FLINK_RESTART_DELAY_MS: ${FLINK_RESTART_DELAY_MS:-10000}
  FLINK_DEDUP_RETENTION_HOURS: ${FLINK_DEDUP_RETENTION_HOURS:-168}
  REDIS_HOST: redis
  REDIS_PORT: ${REDIS_PORT:-6379}
  REDIS_TLS: "false"
  REDIS_USERNAME: ${REDIS_USERNAME:-}
  REDIS_PASSWORD: ${REDIS_PASSWORD:-}
  REDIS_KEY_PREFIX: ${REDIS_KEY_PREFIX:-taobao:active_cart}
  REDIS_CART_TTL_SECONDS: ${REDIS_CART_TTL_SECONDS:-604800}
  REDIS_CONNECT_TIMEOUT_MS: ${REDIS_CONNECT_TIMEOUT_MS:-10000}
  REDIS_SOCKET_TIMEOUT_MS: ${REDIS_SOCKET_TIMEOUT_MS:-5000}
  RULES_KAFKA_TOPIC: ${RULES_KAFKA_TOPIC:-behavior-rules}
  RULES_CONSUMER_GROUP: ${RULES_CONSUMER_GROUP:-taobao-rule-broadcast}

services:
  kafka:
    profiles: ["core", "serving", "cdc", "observability"]
    image: ${KAFKA_IMAGE:-apache/kafka:3.9.0}
    hostname: kafka
    ports:
      - "${KAFKA_EXTERNAL_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://${KAFKA_ADVERTISED_HOSTNAME:-localhost}:9092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

  schema-registry:
    profiles: ["core", "serving", "cdc", "observability"]
    image: ${SCHEMA_REGISTRY_IMAGE:-apicurio/apicurio-registry:3.2.5}
    ports:
      - "${SCHEMA_REGISTRY_EXTERNAL_PORT:-8081}:8080"
    environment:
      APICURIO_STORAGE_KIND: mem

  clickhouse:
    profiles: ["core", "serving", "cdc", "observability"]
    image: ${CLICKHOUSE_IMAGE:-clickhouse/clickhouse-server:24.8}
    ports:
      - "${CLICKHOUSE_HTTP_PORT:-8123}:8123"
      - "${CLICKHOUSE_NATIVE_PORT:-9000}:9000"
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DATABASE:-taobao_behavior}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-local-clickhouse}
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./clickhouse/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user $$CLICKHOUSE_USER --password $$CLICKHOUSE_PASSWORD --query 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 12

  flink-jobmanager:
    profiles: ["core", "serving", "cdc", "observability"]
    image: ${FLINK_IMAGE:-flink:1.20.2-scala_2.12-java11}
    command: jobmanager
    restart: unless-stopped
    ports:
      - "${FLINK_REST_PORT:-8082}:8081"
    environment:
      <<: *flink-environment
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        state.checkpoints.dir: file:///var/lib/flink/checkpoints
        execution.checkpointing.storage: filesystem
    volumes:
      - flink_checkpoints:/var/lib/flink/checkpoints

  flink-taskmanager:
    profiles: ["core", "serving", "cdc", "observability"]
    image: ${FLINK_IMAGE:-flink:1.20.2-scala_2.12-java11}
    command: taskmanager
    restart: unless-stopped
    depends_on:
      - flink-jobmanager
    environment:
      <<: *flink-environment
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 2
        state.checkpoints.dir: file:///var/lib/flink/checkpoints
        execution.checkpointing.storage: filesystem
    volumes:
      - flink_checkpoints:/var/lib/flink/checkpoints

  redis:
    profiles: ["serving"]
    image: ${REDIS_IMAGE:-redis:7.4-alpine}
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  postgres:
    profiles: ["cdc"]
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    ports:
      - "${POSTGRES_EXTERNAL_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-behavior}
      POSTGRES_USER: ${POSTGRES_USER:-debezium}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-for-cdc}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 12

  debezium-connect:
    profiles: ["cdc"]
    image: ${DEBEZIUM_CONNECT_IMAGE:-quay.io/debezium/connect:3.2}
    ports:
      - "${CONNECT_EXTERNAL_PORT:-8083}:8083"
    depends_on:
      kafka:
        condition: service_started
      postgres:
        condition: service_healthy
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      GROUP_ID: ${CONNECT_GROUP_ID:-taobao-debezium}
      CONFIG_STORAGE_TOPIC: ${CONNECT_CONFIG_TOPIC:-taobao-connect-configs}
      OFFSET_STORAGE_TOPIC: ${CONNECT_OFFSET_TOPIC:-taobao-connect-offsets}
      STATUS_STORAGE_TOPIC: ${CONNECT_STATUS_TOPIC:-taobao-connect-status}
      ENABLE_APICURIO_CONVERTERS: "true"
      KEY_CONVERTER: io.apicurio.registry.utils.converter.AvroConverter
      VALUE_CONVERTER: io.apicurio.registry.utils.converter.AvroConverter
      CONNECT_KEY_CONVERTER_APICURIO_REGISTRY_URL: http://schema-registry:8080/apis/registry/v2
      CONNECT_KEY_CONVERTER_APICURIO_REGISTRY_AUTO_REGISTER: "true"
      CONNECT_KEY_CONVERTER_APICURIO_REGISTRY_FIND_LATEST: "true"
      CONNECT_KEY_CONVERTER_APICURIO_REGISTRY_AS_CONFLUENT: "true"
      CONNECT_VALUE_CONVERTER_APICURIO_REGISTRY_URL: http://schema-registry:8080/apis/registry/v2
      CONNECT_VALUE_CONVERTER_APICURIO_REGISTRY_AUTO_REGISTER: "true"
      CONNECT_VALUE_CONVERTER_APICURIO_REGISTRY_FIND_LATEST: "true"
      CONNECT_VALUE_CONVERTER_APICURIO_REGISTRY_AS_CONFLUENT: "true"
      CONNECT_SCHEMA_NAME_ADJUSTMENT_MODE: avro
      REST_ADVERTISED_HOST_NAME: debezium-connect
      CONNECT_PLUGIN_PATH: /kafka/connect

  grafana:
    profiles: ["observability"]
    image: ${GRAFANA_IMAGE:-grafana/grafana:11.4.0}
    ports:
      - "${GRAFANA_EXTERNAL_PORT:-3000}:3000"
    environment:
      GF_INSTALL_PLUGINS: grafana-clickhouse-datasource
      CLICKHOUSE_GRAFANA_URL: ${CLICKHOUSE_GRAFANA_URL:-}
      CLICKHOUSE_DATABASE: ${CLICKHOUSE_DATABASE:-taobao_behavior}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro

volumes:
  clickhouse_data:
  flink_checkpoints:
  redis_data:
  postgres_data:
