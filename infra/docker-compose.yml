name: taobao-runtime

x-flink-environment: &flink-environment
  KAFKA_BOOTSTRAP_SERVERS: kafka:29092
  KAFKA_TOPIC: user-behavior-events
  KAFKA_CONSUMER_GROUP: taobao-stream-job
  KAFKA_SOURCE_BOUNDED: ${KAFKA_SOURCE_BOUNDED:-true}
  KAFKA_SECURITY_PROTOCOL: PLAINTEXT
  SCHEMA_REGISTRY_URL: http://schema-registry:8080/apis/ccompat/v7
  CLICKHOUSE_ENDPOINT: http://clickhouse:8123
  CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
  CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-local-clickhouse}
  CLICKHOUSE_DATABASE: taobao_behavior
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_TLS: "false"
  REDIS_CART_TTL_SECONDS: ${REDIS_CART_TTL_SECONDS:-604800}
  FLINK_CHECKPOINTING_ENABLED: "true"
  FLINK_CHECKPOINT_INTERVAL_MS: ${FLINK_CHECKPOINT_INTERVAL_MS:-60000}
  FLINK_CHECKPOINT_DIR: file:///var/lib/flink/checkpoints
  FLINK_RESTART_ATTEMPTS: ${FLINK_RESTART_ATTEMPTS:-3}
  FLINK_RESTART_DELAY_MS: ${FLINK_RESTART_DELAY_MS:-10000}
  FLINK_DEDUP_RETENTION_HOURS: ${FLINK_DEDUP_RETENTION_HOURS:-168}
  FLINK_MAX_OUT_OF_ORDERNESS_MS: ${FLINK_MAX_OUT_OF_ORDERNESS_MS:-5000}

services:
  kafka:
    image: apache/kafka:3.9.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  schema-registry:
    image: apicurio/apicurio-registry:3.2.5
    ports:
      - "8081:8080"
    environment:
      APICURIO_STORAGE_KIND: mem

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      CLICKHOUSE_DB: taobao_behavior
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-local-clickhouse}
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./clickhouse/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user $$CLICKHOUSE_USER --password $$CLICKHOUSE_PASSWORD --query 'SELECT 1'"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  flink-jobmanager:
    image: flink:1.20.2-scala_2.12-java11
    command: jobmanager
    ports:
      - "8082:8081"
    environment:
      <<: *flink-environment
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        state.checkpoints.dir: file:///var/lib/flink/checkpoints
    volumes:
      - flink_checkpoints:/var/lib/flink/checkpoints
      - ../flink-jobs/taobao-stream-job/target/taobao-stream-job-1.0.0-SNAPSHOT.jar:/opt/flink/usrlib/taobao.jar:ro

  flink-taskmanager:
    image: flink:1.20.2-scala_2.12-java11
    command: taskmanager
    depends_on:
      - flink-jobmanager
    environment:
      <<: *flink-environment
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 2
        state.checkpoints.dir: file:///var/lib/flink/checkpoints
    volumes:
      - flink_checkpoints:/var/lib/flink/checkpoints

volumes:
  clickhouse_data:
  flink_checkpoints:
  redis_data:
