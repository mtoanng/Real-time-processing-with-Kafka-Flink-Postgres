[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "taobao-streaming-platform"
version = "0.1.0"
description = "Streaming pipeline services, shared contracts, and deterministic replay client"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
kafka = ["confluent-kafka[avro,schemaregistry]>=2.6,<3"]
api = [
    "fastapi>=0.115,<1",
    "redis>=5,<7",
    "uvicorn[standard]>=0.30,<1",
]
flink = ["apache-flink==1.20.2"]

[project.scripts]
taobao-replay = "taobao_replay.cli:main"
taobao-catalog = "taobao_catalog.generator:main"

[tool.setuptools]
packages = ["taobao_api", "taobao_catalog", "taobao_events", "taobao_replay", "taobao_serving"]

[tool.setuptools.package-dir]
taobao_api = "services/taobao_api"
taobao_catalog = "tools/taobao_catalog"
taobao_events = "libs/taobao_events"
taobao_replay = "clients/taobao_replay"
taobao_serving = "services/taobao_serving"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"
